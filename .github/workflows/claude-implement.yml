name: Claude Implementer

# Implementer agent. Mention @claude in an issue or PR comment with a ticket
# (e.g. a section of the build spec) and Claude will implement it on a new
# branch and open a PR. Uses Opus 4.8 — strongest reasoning for a from-scratch
# implementation pass, run against the Claude Pro subscription via OAuth token
# rather than metered API billing.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  implement:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-4-8
            --max-turns 75
            --allowedTools "Bash(npm install),Bash(npm run build),Bash(npm run lint),Bash(npm test)"
