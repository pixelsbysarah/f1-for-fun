name: Claude Tester

# Advisory coverage check. Runs after the reviewer, on the same PR events.
# Runs the real test suite as a plain step (fails the job if tests fail,
# same as ci.yml). Then Claude inspects changed files for coverage gaps —
# prioritizing the scoring engine, the F1 API adapter/sanitization layer,
# and auth-related logic — and posts findings as PR comments, the same way
# the reviewer does. It does not write or push code.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Follow the project conventions in CLAUDE.md.

            The test suite for this PR already passed (a prior step ran
            `npm test` and the job would have failed already if it hadn't).
            Your job is advisory only: assess whether coverage is adequate,
            not whether the suite is green.

            1. Identify the files changed in this pull request.
            2. Check whether each changed unit of logic (functions, components,
               API routes) has corresponding Vitest/React Testing Library
               coverage. Prioritize the scoring engine, the F1 API adapter/
               sanitization layer, and any auth-related logic — these are the
               highest-risk areas for silent bugs.
            3. Post your findings as inline comments on the specific lines
               where coverage is missing, or a single summary comment if
               nothing is missing. Include concrete recommendations (what to
               test and why), but do not pad the comment with trivia — only
               flag meaningful gaps.
            4. Do not write or modify any files, and do not attempt to commit
               or push anything. If you find a gap, describe it in a comment
               for a human or the implementer agent to act on.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
            --max-turns 40
