name: Claude Reviewer

# Reviewer agent. Runs automatically on every PR. Reviews for correctness,
# style, and — since this app handles login and MFA — specifically checks
# for secret leakage, injection risk, and auth/RLS logic issues. Posts
# findings as inline PR comments. Uses Sonnet 5: fast and cheap, sufficient
# for a checklist-driven review pass.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request. Follow the project conventions in CLAUDE.md.

            In addition to normal correctness, readability, and style review,
            specifically check for:
            - Any committed secrets, API keys, tokens, or credentials
            - Missing or incorrect Supabase Row Level Security policies on any
              new table or query touching predictions or user data
            - Any write path (predictions insert/update) that doesn't confirm
              an MFA-verified session (aal2) before allowing the write
            - SQL/query injection risk in any hand-written query
            - Any API route or component that exposes more user data than the
              UI actually needs (e.g. other users' emails or account metadata)
            - Untrusted external API (Jolpica/F1 data) responses being stored
              or rendered without sanitization/validation

            Post your findings as inline comments on the specific lines where
            possible, or a single summary comment if you find nothing to flag.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --max-turns 40
